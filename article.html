<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Article | World Live News</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="./" style="text-decoration:none;color:inherit">World<b>Live</b>News</a><div class="sp"></div><div id="gt"></div></header><main><article id="x" style="padding:14px 0">Loading...</article></main><footer>World Live News</footer>
<script src="config.js"></script><script>
var C=window.NEWS_CONFIG,id=new URLSearchParams(location.search).get('id');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
fetch(C.API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'cms'})}).then(r=>r.json()).then(function(c){var a=(c.custom||[]).find(function(x){return x.id===id});var x=document.getElementById('x');if(!a){x.textContent='Article not found.';return}document.title=a.h+' | World Live News';x.setAttribute('dir',a.l==='ar'?'rtl':'ltr');x.innerHTML='<div class="meta"><b>'+esc(a.c)+'</b> · '+new Date(a.d).toUTCString().slice(5,22)+' UTC</div><h1>'+esc(a.h)+'</h1>'+a.p.map(function(p){return '<p class="ap">'+esc(p)+'</p>'}).join('')+(a.u?'<div class="src">Source: <a href="'+esc(a.u)+'" rel="nofollow noopener">'+esc(a.src||a.u)+'</a></div>':'')});
</script></body></html>
