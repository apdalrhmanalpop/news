name: update-news
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - run: |
          git config user.name news-bot
          git config user.email bot@users.noreply.github.com
          git add news.json index.html sitemap.xml robots.txt feed.xml
          git diff --cached --quiet || (git commit -m "news update" && git push)
